<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){
      var t = localStorage.getItem('claude-bar-theme');
      if (t === 'light' || t === 'mauve') document.documentElement.dataset.theme = t;
    })();
  </script>
</head>

<body>
  <div class="wrap">
    <div class="resize-handle" id="resizeHandle"></div>
    <div class="bar">
      <div class="top-row">
        <div class="left">
          <div class="dot load" id="dot"></div>
          <span class="label">Claude</span>
        </div>
        <div class="timer" id="timer">--:--</div>
      </div>
      <div class="plan-row">
        <span class="plan-label" id="planLabel"></span>
        <span class="reset-times" id="resetTimes"></span>
      </div>
      <div id="barsScreen">
        <div class="bars" id="bars">
          <div class="no-data">loading...</div>
        </div>
      </div>
      <div id="histScreen" style="display:none" class="hist-screen">
        <div class="hist-chips" id="histChips"></div>
        <svg class="sparkline" id="sparkline" viewBox="0 0 200 64" preserveAspectRatio="none"></svg>
        <div class="hist-status" id="histStatus"></div>
      </div>
      <div class="update-banner" id="updateBanner" title="Click to install"></div>
      <div class="footer">
        <span class="updated" id="updated">refreshing every 2min</span>
        <button class="theme-btn" id="refreshBtn" title="Refresh now">↻</button>
        <button class="theme-btn" id="histBtn" title="Usage history">∿</button>
        <button class="theme-btn" id="themeBtn" title="Cycle theme">◑</button>
        <button class="theme-btn" id="pinBtn" title="Toggle always on top">⊤</button>
        <button class="login-btn" id="loginBtn">↗ log in</button>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>

</html>
